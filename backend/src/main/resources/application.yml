spring:
  application:
    name: arca
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/arca_db}
    username: ${DATABASE_USER:arca_user}
    password: ${DATABASE_PASS:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Programa ARCA
    description: Plataforma institucional de atendimento animal da Prefeitura da Serra
    version: 1.0.0

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-}]"

arca:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:arca-api}
    audience: ${JWT_AUDIENCE:arca-admin}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:28800000}
    clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    cookies:
      secure: ${COOKIE_SECURE:false}
      same-site: ${COOKIE_SAME_SITE:Lax}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
    operationsSorter: method
