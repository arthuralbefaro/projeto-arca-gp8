server:
  port: 8081

spring:
  application:
    name: arca
  datasource:
    url: jdbc:postgresql://localhost:5435/arca_db
    username: arca_user
    password: arca_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
      - https://arthuralbefaro.github.io